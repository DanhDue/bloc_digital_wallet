name: ui_kit
description: UI Kit containing reusable widgets and components.
version: 0.1.0
resolution: workspace
publish_to: none

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # Local packages
  core:
    path: ../core
  framework:
    path: ../framework
  # UI Components
  flutter_svg: ^2.2.3
  lottie: ^3.1.4
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_boring_avatars: ^2.0.1
  pretty_qr_code: ^3.5.0
  image_gallery_saver_plus: ^4.0.1
  flutter_smart_dialog: ^4.9.4
  modal_bottom_sheet: ^3.0.0
  card_swiper: ^3.0.1
  animated_item: ^0.0.2
  animated_text_kit: ^4.3.0
  # Theme
  theme_tailor_annotation: ^3.1.1
  # Note: bloc, flutter_bloc, auto_route, get_it come from core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  theme_tailor: ^3.1.1
  flutter_gen_runner: ^5.12.0

flutter_gen: 
  output: lib/generated/
  integrations: 
    flutter_svg: true
    rive: false
    lottie: true
  assets: 
    outputs: 
      class_name: Assets
    enabled: true
  colors: 
    outputs: 
      class_name: AppColors
    inputs: 
      - assets/colors/colors.xml
    enabled: true
  fonts: 
    outputs: 
      class_name: AppFontFamily
      package_parameter_enabled: true
    enabled: true
  line_length: 99

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lotties/
    - assets/jsons/
  fonts: 
    - family: SfCompactRegular
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Regular.ttf
    - family: SfCompactMedium
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Medium.ttf
    - family: SfCompactSemiBold
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Semibold.ttf
    - family: SfCompactBold
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Bold.ttf
