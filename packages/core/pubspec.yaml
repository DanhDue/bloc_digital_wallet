name: core
description: Core utilities, errors, and extensions for the Bloc Digital Wallet.
version: 0.1.0
resolution: workspace
publish_to: none

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # State Management
  bloc: ^8.1.0
  flutter_bloc: ^8.1.0
  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.5.0
  # Data Classes & Serialization
  equatable: ^2.0.8
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  # Networking
  dio: ^5.9.0
  retrofit: ^4.9.2
  # Functional Programming
  dartz: ^0.10.1
  # Localization
  slang: ^4.0.0
  slang_flutter: ^4.0.0
  # Routing
  auto_route: ^11.1.0
  # Utilities
  connectivity_plus: ^7.0.0
  intl: ^0.20.1
  flutter_secure_storage: ^10.0.0
  # Reactive & Streams
  rxdart: ^0.28.0
  stream_transform: ^2.1.1
  # Local Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # Icons
  cupertino_icons: ^1.0.8
  # Permissions
  permission_handler: ^12.0.1
  # Date Utils
  jiffy: ^6.4.4
  # Crypto
  crypto: ^3.0.3
  package_info_plus: ^8.1.2
  logger:
    path: ../logger

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  # Code Generation
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.1
  auto_route_generator: ^10.4.0
  slang_build_runner: ^4.0.0
  injectable_generator: ^2.6.1
  flutter_gen_runner: ^5.12.0
  # Testing
  mocktail: ^1.0.4

flutter: {}

flutter_gen:
  output: lib/generated/
  line_length: 99
