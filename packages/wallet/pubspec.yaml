name: wallet
description: "Wallet feature package for Digital Wallet."
version: 0.0.1
resolution: workspace
publish_to: none
homepage:

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Local Packages
  core:
    path: ../core
  network:
    path: ../network
  ui_kit:
    path: ../ui_kit
  framework:
     path: ../framework
  
  # Dependencies
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  slang: ^4.0.0
  slang_flutter: ^4.0.0


  
  # UI
  card_swiper: ^3.0.1
  pretty_qr_code: ^3.5.0
  shimmer: ^3.0.0
  flutter_smart_dialog: ^4.9.8+9
  animated_visibility: ^0.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  retrofit_generator: ^10.2.1
  auto_route_generator: ^10.4.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  flutter_gen_runner: ^5.12.0
  bloc_test: ^9.1.5
  mockito: ^5.4.4
  slang_build_runner: ^4.0.0

flutter_gen: 
  output: lib/generated/
  integrations: 
    flutter_svg: true
    rive: false
    lottie: true
  assets: 
    outputs: 
      class_name: Assets
    enabled: true
  colors: 
    outputs: 
      class_name: AppColors
    inputs: 
      - assets/colors/colors.xml
    enabled: false
  fonts: 
    outputs: 
      class_name: AppFontFamily
      package_parameter_enabled: true
    enabled: true
  line_length: 99

flutter:
  uses-material-design: true
  assets:
    - assets/jsons/
    - assets/images/
    - assets/lotties/
    - assets/jsons/
    - assets/colors/
