name: authentication
description: "Authentication feature package for Digital Wallet."
version: 0.0.1
resolution: workspace
publish_to: none
homepage:

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Local Packages
  core:
    path: ../core
  network:
    path: ../network
  ui_kit:
    path: ../ui_kit
  framework:
     path: ../framework
  # Auth providers
  google_sign_in: ^7.2.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  retrofit_generator: ^10.2.1
  auto_route_generator: ^10.4.0
  freezed: ^3.2.4
  json_serializable: ^6.11.3
  injectable_generator: ^2.6.1
  flutter_gen_runner: ^5.12.0

flutter_gen:
  output: lib/src/generated/
  integrations:
    flutter_svg: true
    rive: false
    lottie: true
  assets:
    outputs:
      class_name: AuthAssets
    enabled: true
  colors:
    outputs:
      class_name: AuthColors
    inputs:
      - assets/colors/colors.xml
    enabled: true
  fonts:
    outputs:
      class_name: AuthFontFamily
      package_parameter_enabled: true
    enabled: true
  line_length: 99

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lotties/
    - assets/jsons/
    - assets/colors/
