name: onboard
description: Onboard feature package for Bloc Digital Wallet.
version: 0.1.0
resolution: workspace
publish_to: none

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  # Onboard-specific dependencies
  animated_visibility: ^0.0.4
  pretty_animated_text: ^2.0.0
  json_annotation: ^4.9.0

  # Local Packages
  core:
    path: ../core
  network:
    path: ../network
  app_platform:
    path: ../platform
  ui_kit:
    path: ../ui_kit
  framework:
    path: ../framework
  settings:
    path: ../settings
  logger:
    path: ../logger

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  auto_route_generator: ^10.4.0
  slang_build_runner: ^4.0.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  retrofit_generator: ^10.2.1
  injectable_generator: ^2.6.1

flutter:
  assets:
    - assets/locales/
