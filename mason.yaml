# Register bricks which can be consumed via the Mason CLI.
# Run "mason get" to install all registered bricks.
bricks:
  # MVI Feature brick for Clean Architecture + MVI pattern
  mvi_feature:
    path: bricks/mvi_feature
  
  # MVI Subfeature brick for adding features to existing modules
  mvi_subfeature:
    path: bricks/mvi_subfeature
  remove_feature:
    path: bricks/remove_feature
  remove_subfeature:
    path: bricks/remove_subfeature
