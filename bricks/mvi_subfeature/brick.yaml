name: mvi_subfeature
description: MVI subfeature with BaseMviPage - Initial state only, skeleton for expansion
version: 1.0.0+1

environment:
  mason: ^0.1.2

vars:
  module_name:
    type: string
    description: The name of the existing module (e.g., authentication, settings)
    prompt: What is the module name?

  subfeature_name:
    type: string
    description: The name of the subfeature (e.g., profile, edit_settings)
    prompt: What is the subfeature name?
