name: remove_subfeature
description: Remove a subfeature generated by mvi_subfeature.
version: 1.0.0
environment:
  mason: ^0.1.0
vars:
  module_name:
    type: string
    description: The name of the parent module (e.g., authentication, home)
    prompt: What is the parent module name?
  
  subfeature_name:
    type: string
    description: The name of the subfeature to remove
    prompt: What is the subfeature name?
