name: remove_pac_feature
description: Removes a feature package created by pac_mvi_feature and cleans up all registrations.
version: 0.1.0+1
environment:
  mason: ">=0.1.0-dev.26 <1.0.0"
vars:
  name:
    type: string
    description: The name of the feature package to remove (e.g. promo_feature).
    prompt: What is the name of the feature package to remove?
