name: remove_feature
description: "[DEPRECATED — use pac_mvi_feature/pac_mvi_subfeature instead] Remove a feature generated by mvi_feature, including files and routes."
version: 1.0.0
environment:
  mason: ^0.1.0
vars:
  feature_name:
    type: string
    description: The name of the feature to remove (camelCase or snake_case)
    prompt: What is the feature name to remove?
