name: bloc_digital_wallet
description: "A digital wallet app base on Flutter BLOC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  lottie: ^3.1.4
  
  # Theme
  theme_tailor_annotation: ^3.1.2
  
  # State Management (MVI Pattern)
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  bloc_concurrency: ^0.3.0
  
  # Dependency Injection
  get_it: ^9.2.0
  injectable: ^2.5.0
  
  # Networking
  dio: ^5.9.0
  retrofit: ^4.9.2
  connectivity_plus: ^7.0.0
  
  # Data & Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  
  # Functional Programming
  dartz: ^0.10.1
  stream_transform: ^2.1.1
  
  # Value Equality
  equatable: ^2.0.8
  crypto: ^3.0.3
  
  # Logging & Debugging
  talker_flutter: ^5.1.9
  talker_dio_logger: ^5.1.9
  talker_bloc_logger: ^5.1.9
  logger: ^2.5.0
  
  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Authentication
  google_sign_in: ^7.2.0
  
  # Localization
  slang: ^4.0.0
  slang_flutter: ^4.0.0
  
  # Utils
  permission_handler: ^12.0.1
  jiffy: ^6.4.4
  rxdart: ^0.28.0
  auto_route: ^11.1.0
  intl: ^0.20.1

  # Local Packages
  native_security:
    path: packages/native_security

  # Smart Dialog
  flutter_smart_dialog: ^4.9.8+9

  # Animation Packages
  animated_visibility: ^0.0.4
  animated_item: ^0.0.2
  animated_text_kit: ^4.3.0
  pretty_animated_text: ^2.0.0

  # Modal Bottom Sheet
  modal_bottom_sheet: ^3.0.0

  # Avatars
  flutter_boring_avatars: ^2.0.1

  # Image
  cached_network_image: ^3.4.1
  pretty_qr_code: ^3.5.0
  image_gallery_saver_plus: ^4.0.1
  card_swiper: ^3.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0
  
  # Workspace Management
  melos: ^7.3.0
  
  # Code Generation
  freezed: ^3.2.4
  json_serializable: ^6.11.3
  theme_tailor: ^3.1.2
  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0
  injectable_generator: ^2.7.0
  retrofit_generator: ^10.2.1
  slang_build_runner: ^4.0.0
  
  # Testing
  mocktail: ^1.0.4
  
  # Code Templates
  mason: ^0.1.0-dev.59
  auto_route_generator: ^10.4.0

dartfmt: 
  line_length: 99

melos:
  scripts:
    genAlls:
      run: ./scripts/genAlls.sh
      description: Generate all models, APIs, themes, assets, and localization.
    genTheme:
      run: fvm flutter pub run build_runner build --delete-conflicting-outputs
      description: Generate theme classes with theme_tailor.
    genImages:
      run: fvm flutter pub run build_runner build --delete-conflicting-outputs
      description: Generate type-safe accessors for images.
    genColors:
      run: fvm flutter pub run build_runner build --delete-conflicting-outputs
      description: Generate type-safe accessors for colors from assets/colors/colors.xml.
    genLocales:
      run: get generate locales assets/locales
      description: Generate localization classes from JSON files in assets/locales.
    build_runner:
      run: fvm flutter pub run build_runner build --delete-conflicting-outputs
      description: Run build_runner to generate code for Freezed, Retrofit, etc.
    build_runner_watch:
      run: fvm flutter pub run build_runner watch --delete-conflicting-outputs
      description: Watch mode for build_runner with auto-regeneration.
    dartfmt:
      run: ./scripts/dartfmt.sh
      description: Format Dart code with 99 line length.
    format:
      run: fvm dart format lib test -l 99
      description: Format Dart files in lib and test directories.
    add-header-ignore-flags:
      run: ./scripts/add_header_ignore_flags.sh
      description: |
        Add header ignore_flags.txt to all necessary files.
        - Requires: Run this one before header license adding.
    add-license-header:
      run: ./scripts/add_license_header.sh
      description: |
        Add a license header to all necessary files.
        - Requires: Run add-header-ignore-flags to add necessary ignore flags first.
    check-license-header:
      run: ./scripts/check_license_header.sh
      description: check the license header in all necessary files.

    # Testing
    test:
      run: fvm flutter test
      description: Run Flutter tests.

    test_coverage:
      run: ./scripts/testWithCoverage.sh
      description: Run tests with coverage report.

    # Build commands
    build_apk:
      run: ./scripts/buildApk.sh
      description: Build Android APK.

    build_bundle:
      run: ./scripts/buildBundle.sh
      description: Build Android App Bundle.

    build_ios:
      run: ./scripts/buildIPA.sh
      description: Build iOS IPA.

    # Analysis
    analyze:
      run: fvm flutter analyze
      description: Analyze Dart code for issues.

    # Git tools
    install_git_hooks:
      run: ./scripts/install_git_tools.sh
      description: Install Git hooks for the project.

    # Mason code generation
    mason_get:
      run: mason get
      description: Install Mason bricks.

    mason_make_feature:
      run: mason make mvi_feature
      description: Generate a new feature with Clean Architecture + MVI structure.

    mason_make_subfeature:
      run: mason make mvi_subfeature
      description: Generate a subfeature within an existing module.

    mason_list:
      run: mason list
      description: List all available Mason bricks.

    mason_upgrade:
      run: mason upgrade
      description: Upgrade Mason bricks to latest versions.

    enableSingleTouches:
      run: defaults write com.apple.iphonesimulator ShowSingleTouches 1
      description: Enable single touches in iOS Simulator.

    disableSingleTouches:
      run: defaults write com.apple.iphonesimulator ShowSingleTouches 0
      description: Disable single touches in iOS Simulator.

theme_tailor:
  input_folder: lib/config/theme
  output_folder: lib/config/theme
  output_line_length: 99

flutter_gen: 
  output: lib/generated/
  integrations: 
    flutter_svg: true
    rive: false
    lottie: true
  assets: 
    outputs: 
      class_name: Assets
    enabled: true
  colors: 
    outputs: 
      class_name: AppColors
    inputs: 
      - assets/colors/colors.xml
    enabled: true
  fonts: 
    outputs: 
      class_name: AppFontFamily
      package_parameter_enabled: true
    enabled: true
  line_length: 99

flutter:
  uses-material-design: true
  assets: 
    - assets/images/
    - assets/lotties/
    - assets/jsons/
  fonts: 
    - family: SfCompactRegular
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Regular.ttf
    - family: SfCompactMedium
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Medium.ttf
    - family: SfCompactSemiBold
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Semibold.ttf
    - family: SfCompactBold
      fonts: 
        - asset: assets/fonts/SF_Compact_Display_Bold.ttf
